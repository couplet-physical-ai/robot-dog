# Unitree Go2 EDU unit manifest TEMPLATE
#
# Copy this file to the approved private inventory for ONE physical unit.
# This committed template intentionally contains no real serial, MAC, IP,
# credential, token, key, or private evidence path. Do not replace the
# placeholders in this repository.
#
# Evidence values must be marked observed, reported, inferred, or unknown in
# the accompanying record. `null` is preferable to an assumption.

schema_version: "0.1"
record_kind: "unitree-go2-edu-unit-manifest-template"
classification: "<classification>"

