  intake:
    status: "unknown" # accepted_read_only | accepted_motion_test | hold | rejected
    date: "YYYY-MM-DD"
    timezone: "<IANA-timezone>"
    operator: "<operator-id>"
    custodian: "<team-or-custodian>"
    provenance: "<purchase-loan-return-or-other>"

