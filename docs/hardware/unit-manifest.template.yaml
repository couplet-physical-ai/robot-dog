  asset_id: "<synthetic-unit-id>"
  manufacturer: "Unitree Robotics"
  family: "Go2 EDU"
  exact_sku: null
  configuration_label: null
  serial: null # private inventory only; never commit a real value here
  firmware:
    robot: null
    bootloader: null
