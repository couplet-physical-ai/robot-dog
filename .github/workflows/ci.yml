name: Offline CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install
      # No Unitree, CycloneDDS, ROS 2, target credentials, or hardware.
      - name: Install default development environment
        run: uv sync --locked --group dev
      - name: Run hardware-free tests
        run: uv run --locked pytest
      - name: Smoke-test deterministic default
        run: uv run --locked robot-dog demo --json
      - name: Validate docs
        run: uv run --locked mkdocs build --strict
