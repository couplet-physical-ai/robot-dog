# Roadrunner CI (Woodpecker + Dagger, https://cicd.apps.example.com): port of .github/workflows/ci.yml (Offline CI) — Python 3.11 (.python-version), uv sync --locked --group dev, hardware-free pytest, `robot-dog demo --json` smoke, strict mkdocs build. No Unitree, CycloneDDS, ROS 2 or hardware.
# `$$` escapes `$` for Woodpecker. Docs: https://cicd.docs.example.com/roadrunner/
labels:
  tier: "0"
when:
  - event: pull_request
  - event: [push, manual]
    branch: main
steps:
  - name: offline
    image: bash
    environment:
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://192.0.2.1:4318/v1/logs
      OTEL_EXPORTER_OTLP_LOGS_PROTOCOL: http/protobuf
    commands:
      - >-
        ci-runner v0.10.1 python-uv --src=. --repo="$${CI_REPO_NAME,,}" --python=3.11 --sync-args=--locked,--group=dev
        --run='uv run --locked pytest && uv run --locked robot-dog demo --json && uv run --locked mkdocs build --strict'
        --dep-cache=registry.dev.example.com/cache
        --dep-cache-password=file:///etc/ci/cache-password --test-workers=2
